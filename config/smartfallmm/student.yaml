model_args:
  imu_frames: 128
  imu_channels: 4
  num_heads: 4
  num_layers: 2
  embed_dim: 64
  dropout: 0.5
  use_se: False
  use_temporal_attention: False
  use_pos_encoding: False
  se_reduction: 4
  activation: silu
  norm_first: True

# model_args:
#   input_dim: 4
#   seq_len: 128
#   embed_dim: 64
#   num_heads: 4
#   mlp_dim: 128
#   num_layers: 2
#   dropout: 0.1

dataset_args: 
 mode: 'sliding_window'
 max_length: 128
 #change task to 'har' for Human activity recognition
 task : 'fd'
 modalities: ['skeleton', 'accelerometer']
 age_group: ['young', 'old']
 # change the sensor to phone , meta_wrist , meta_hip for experiments
 sensors: ['watch']

batch_size: 64
test_batch_size: 64
val_batch_size : 64
num_epoch: 80

#dataloader
feeder: Feeder.Make_Dataset.UTD_mm


########
train_feeder_args:
  # npz_file: data/UTD_MAAD/utd_train_op_mf50_norm.npz
  batch_size: 64

val_feeder_args:
  # npz_file: data/UTD_MAAD/utd_val_op_mf50_norm.npz
  batch_size: 64

test_feeder_args: 
  # npz_file: data/UTD_MAAD/utd_test_op_mf50_norm.npz
  batch_size: 64

seed: 2 
optimizer: adamw
base_lr: 1e-3
weight_decay: 4e-4